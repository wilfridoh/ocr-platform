<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma OCR · Maqueta de pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FA; --surface:#fff; --ink:#0F172A; --ink2:#475569; --ink3:#64748B; --line:#E2E8F0; --line2:#F1F5F9;
  --brand:#4338CA; --brand-h:#3730A3; --brand-soft:#EEF0FF; --brand-line:#C7CCF8;
  --ok:#047857; --ok-soft:#E6F6EF; --warn:#B45309; --warn-soft:#FEF3C7; --err:#B91C1C; --err-soft:#FEE2E2;
  --side:#0F172A; --side-ink:#94A3B8;
  --sans:'Inter','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;color:#fff;font-weight:700;font-size:15px}
.brand .lg{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366F1,#4338CA);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--side-ink)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:#1E293B;color:#fff}
.nav a.on{background:#312E81;color:#fff}
.nav .cnt{margin-left:auto;font-size:11px;background:#1E293B;border-radius:99px;padding:1px 8px;color:#CBD5E1}
.side .sp{flex:1}
.status{background:#111C33;border:1px solid #1E293B;border-radius:10px;padding:10px 12px;font-size:12px;color:#CBD5E1}
.status b{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.status a{display:flex;gap:6px;align-items:center;color:var(--side-ink);font-size:12px;text-decoration:none;margin-top:8px}
.status a:hover{color:#fff}
main{padding:28px 32px 90px;max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--ink3);margin-top:2px}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:6px}
.crumb a{color:var(--ink3);text-decoration:none}.crumb a:hover{color:var(--brand)}
/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>h3,.ch{font-size:13px;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.cb{padding:16px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-h)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}.btn.gh:hover{background:var(--line2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.err{background:var(--err-soft);color:var(--err)}.chip.br{background:var(--brand-soft);color:var(--brand)}
.chip .dot{width:6px;height:6px;box-shadow:none;background:currentColor}
.kw{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);border-radius:99px;padding:3px 6px 3px 12px;font-weight:500;font-size:13px}
.kw.plain{padding:3px 12px}
.kw .w{display:inline-flex;gap:2px;margin-left:4px}.kw .w i{width:6px;height:6px;border-radius:50%;background:var(--brand-line)}.kw .w i.f{background:var(--brand)}
.kw button{border:0;background:transparent;color:var(--brand);display:grid;place-items:center;width:18px;height:18px;border-radius:50%}.kw button:hover{background:var(--brand-line)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.in,select.in,textarea.in{width:100%;border:1px solid #CBD5E1;border-radius:8px;padding:8px 11px;background:#fff;font-size:13px}
.in:focus{outline:2px solid var(--brand-line);border-color:var(--brand)}
.in.mono,.mono{font-family:var(--mono);font-size:12.5px}
.help{font-size:12px;color:var(--ink3);margin-top:4px}
.sw{width:34px;height:20px;border-radius:99px;background:#CBD5E1;position:relative;border:0;padding:0;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}.sw.on::after{left:16px}
.seg{display:inline-flex;background:var(--line2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-weight:600;font-size:12px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);text-align:left;padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.row:hover td{background:#F8FAFF;cursor:pointer}
.tr{text-align:right}
.conf{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.bar{width:54px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.conf.warn .bar i{background:#D97706}.conf.warn{color:var(--warn)}.conf.err{color:var(--err)}.conf.ok{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:#FCD34D;color:#78350F}
.alert.err{background:var(--err-soft);border-color:#FCA5A5;color:#7F1D1D}
.alert.info{background:var(--brand-soft);border-color:var(--brand-line);color:#312E81}
.alert b{display:block}.alert .btn{margin-left:auto}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px}
.muted{color:var(--ink3)}
/* dropzone */
.drop{border:2px dashed #B6BEF0;background:linear-gradient(180deg,#FAFAFF,#F3F4FF);border-radius:14px;padding:34px 20px;text-align:center;transition:.15s}
.drop:hover{border-color:var(--brand);background:var(--brand-soft)}
.drop .ic{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--brand-line);display:grid;place-items:center;margin:0 auto 12px;color:var(--brand)}
.drop .ic svg{width:24px;height:24px}
.drop strong{font-size:15px}
/* progreso */
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;position:relative}
.prog::after{content:"";position:absolute;inset:0;width:35%;background:var(--brand);border-radius:9px;animation:ind 1.3s ease-in-out infinite}
@keyframes ind{0%{left:-35%}100%{left:100%}}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.file .fi{width:36px;height:36px;border-radius:8px;background:var(--err-soft);color:var(--err);display:grid;place-items:center;font-size:10px;font-weight:700}
/* campos */
.fld{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:default;border-left:3px solid transparent}
.fld:hover,.fld.hl{background:var(--brand-soft);border-left-color:var(--brand)}
.fld .n{font-size:12px;color:var(--ink3)}
.fld .v{font-weight:600;font-size:14px;word-break:break-word}
.fld .c{grid-row:1/3;grid-column:2;align-self:center}
.fld.warn{background:#FFFBEB}.fld.warn .v{color:var(--warn)}
.fld.miss{background:#FEF2F2}.fld.miss .v{color:var(--err);font-weight:500;font-style:italic}
.fld .tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.fld.warn .tag{background:var(--warn-soft);color:var(--warn)}.fld.miss .tag{background:var(--err-soft);color:var(--err)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink3);padding:10px 16px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
/* documento simulado */
.pg{background:#E8EAF0;border-radius:0 0 var(--r) var(--r);padding:16px}
.doc{container-type:inline-size;position:relative;background:#fff;aspect-ratio:100/135;box-shadow:0 4px 18px rgba(15,23,42,.18);font-family:Arial,sans-serif;color:#222;overflow:hidden}
.doc .hd{position:absolute;left:0;right:0;top:0;height:11%;background:#1E3A8A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%}
.doc .hd b{font-size:5.4cqw;letter-spacing:.02em}.doc .hd span{font-size:2.5cqw;text-align:right;opacity:.9;line-height:1.3}
.doc .d{position:absolute;padding:.8cqw 1.4cqw;border-radius:1cqw;border:.4cqw solid transparent;transition:.12s}
.doc .d small{display:block;font-size:2.1cqw;color:#6B7280;letter-spacing:.04em;text-transform:uppercase}
.doc .d span{display:block;font-size:3.1cqw;font-weight:700;line-height:1.25}
.doc.on .d{border-color:rgba(67,56,202,.45);background:rgba(99,102,241,.08)}
.doc.on .d.w{border-color:rgba(217,119,6,.7);background:rgba(245,158,11,.14)}
.doc.on .d.m{border-color:#DC2626;border-style:dashed;background:rgba(220,38,38,.07)}
.doc .d.act,.doc.on .d.act{border-color:var(--brand);background:rgba(99,102,241,.22);box-shadow:0 0 0 .8cqw rgba(99,102,241,.25)}
.doc .d.w.act{border-color:#D97706;background:rgba(245,158,11,.3);box-shadow:0 0 0 .8cqw rgba(245,158,11,.25)}
.doc .d.m.act{border-color:#DC2626;box-shadow:0 0 0 .8cqw rgba(220,38,38,.2)}
.doc .blur span{filter:blur(.7cqw);opacity:.6}
.doc .ln{position:absolute;left:6%;right:6%;height:1.4cqw;border-radius:1cqw;background:#E5E7EB}
.doc .tbl{position:absolute;left:6%;right:6%;border:.3cqw solid #E5E7EB;border-radius:1cqw}
.doc .tx{position:absolute;font-size:2.3cqw;color:#9CA3AF}
.doc .zona{position:absolute;border:.5cqw dashed #4338CA;background:rgba(99,102,241,.12);border-radius:.8cqw}
.doc .zona i{position:absolute;width:2cqw;height:2cqw;background:#fff;border:.4cqw solid #4338CA;border-radius:.4cqw}
.pgbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3)}
.pgbar .zm{display:flex;gap:4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:500}
/* json */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:50;padding:24px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:14px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal .box>div:first-child{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
pre.json{background:#0F172A;color:#E2E8F0;font:12.5px/1.65 var(--mono);padding:18px;overflow:auto;flex:1}
.jk{color:#93C5FD}.js{color:#86EFAC}.jn{color:#FCD34D}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;border-radius:10px;padding:10px 16px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* asistente */
.steps{display:flex;gap:0;margin-bottom:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.step{display:flex;align-items:center;gap:10px;flex:1;color:var(--ink3);font-weight:600}
.step .nb{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;background:#fff;flex:none}
.step small{display:block;font-weight:400;font-size:12px}
.step.on{color:var(--ink)}.step.on .nb{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done .nb{background:var(--ok);border-color:var(--ok);color:#fff}.step.done{color:var(--ink2)}
.step+.step::before{content:"";flex:0 0 40px;height:2px;background:var(--line);margin-right:10px;margin-left:-6px}
.step.done+.step::before,.step.on::before{background:var(--brand)}
.foot{position:sticky;bottom:0;margin:22px -32px -90px;padding:14px 32px;background:rgba(245,246,250,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:5}
.ocrtxt{font:12.5px/1.7 var(--mono);color:var(--ink2);white-space:pre-wrap;padding:14px 16px;max-height:470px;overflow:auto}
.ocrtxt mark{background:#FEF08A;border-radius:3px;padding:0 2px}
.rule{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:14px}
.suggest{border-left:3px solid var(--brand)}
.live{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:8px 11px;font-size:12.5px;display:flex;gap:8px;align-items:center;margin-top:8px;color:#14532D}
.live code{font-family:var(--mono);font-weight:600}
.tl{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.tl .b{height:10px;border-radius:9px;background:var(--line2);overflow:hidden}.tl .b i{display:block;height:100%;background:var(--brand);border-radius:9px}
.empty{text-align:center;padding:56px 20px}
.empty .ic{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.empty .ic svg{width:30px;height:30px}
.empty h2{font-size:18px;margin-bottom:6px}.empty p{color:var(--ink3);max-width:420px;margin:0 auto 18px}
/* demo */
.demo{position:fixed;right:16px;top:12px;background:#111827;color:#E5E7EB;border-radius:12px;padding:8px 10px;display:flex;gap:6px;align-items:center;font-size:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.demo b{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#9CA3AF;margin:0 4px}
.demo button{border:0;background:#1F2937;color:#E5E7EB;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:500}
.demo button.on{background:#6366F1;color:#fff}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3)}
.pager div{display:flex;gap:4px}.pager button{min-width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:600;font-size:13px}.pager button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters .in{width:auto;min-width:150px}
.sr{position:relative}.sr svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}.sr .in{padding-left:32px;min-width:230px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:14px 16px}.kpi small{color:var(--ink3);font-weight:500}.kpi b{display:block;font-size:24px;letter-spacing:-.02em;margin-top:2px}.kpi span{font-size:12px}
.ver{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
.ver .vb{background:var(--line2);border-radius:6px;font-weight:700;font-size:12px;padding:2px 8px}
.ver.cur .vb{background:var(--brand);color:#fff}
.sr.big{display:block}.sr.big .in{padding:12px 40px 12px 42px;font-size:15px;border-radius:10px;width:100%}.sr.big svg{left:14px}
.sr .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--ink2)}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.fl{width:56px;font-size:12px;font-weight:600;color:var(--ink3)}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.pill:hover{border-color:var(--brand-line);background:var(--brand-soft)}.pill.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pill.ghost{border-style:dashed;color:var(--ink3)}
.dr{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink3)}.dr .in{width:auto}
.card{overflow-x:auto}.card td,.card th{padding-left:12px;padding-right:12px}
.ro .btn.pri,.ro .btn[disabled]{opacity:.5}.ro input:disabled,.ro select:disabled{background:#F8FAFC}
.rolbox{background:#111C33;border:1px solid #1E293B;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:11px;color:#94A3B8}
.rolbox span{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-bottom:4px}
.rolbox select{width:100%;background:#0F172A;color:#fff;border:1px solid #334155;border-radius:7px;padding:5px 8px;font-size:12.5px}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#64748B;padding:14px 10px 6px}
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.ck:last-of-type{border:0}.ck input{width:17px;height:17px;accent-color:var(--brand)}.ck small{display:block;color:var(--ink3);font-size:11.5px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line2)}.opt:last-child{border:0}
body.solo .side{display:none}body.solo .app{grid-template-columns:minmax(0,1fr)}body.solo main{max-width:none;padding:28px 16px 90px;background:linear-gradient(180deg,#EEF0FF,#F5F6FA 260px);min-height:100vh}
.capwrap{max-width:460px;margin:0 auto}.caphead{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 22px;font-weight:700;font-size:15px}
.capcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.08);padding:26px 24px;text-align:center}
.capcard h2{font-size:21px;letter-spacing:-.01em;margin-bottom:18px;line-height:1.3}
.capbtns{display:grid;gap:12px}
.capbtn{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto auto;align-items:center;column-gap:14px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;transition:.15s}
.capbtn:hover:not([disabled]){border-color:var(--brand);background:var(--brand-soft)}

const DISO={1:'2026-11-12',2:'2026-11-12',3:'2026-11-12',4:'2026-11-12',5:'2026-11-11',6:'2026-11-11',7:'2026-11-11',8:'2026-11-10',9:'2026-11-10',10:'2026-11-10'};
const DF={q:'',tipo:'',est:'',desde:'',hasta:''};
const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function docsFiltrados(){
  const q=norm(DF.q.trim());
  return DOCS.filter(d=>{
    if(DF.tipo&&d[1]!==DF.tipo)return false;
    if(DF.est&&d[3]!==DF.est)return false;
    if(DF.desde&&DISO[d[5]]<DF.desde)return false;
    if(DF.hasta&&DISO[d[5]]>DF.hasta)return false;
    if(q&&!norm(d[0]+' '+d[1]+' '+DTXT[d[5]]).includes(q))return false;
    return true;
  });
}
function snippet(d){
  const q=DF.q.trim();if(!q)return '';
  const t=DTXT[d[5]]||'';const i=norm(t).indexOf(norm(q));if(i<0)return '';
  const a=Math.max(0,i-22),e=Math.min(t.length,i+q.length+22);
  return `<div class="muted" style="font-size:12px;margin-top:2px">${a>0?'…':''}${t.slice(a,i)}<mark style="background:#FEF08A;border-radius:3px;padding:0 2px">${t.slice(i,i+q.length)}</mark>${t.slice(i+q.length,e)}${e<t.length?'…':''}</div>`;
}
function nFiltros(){return [DF.q.trim(),DF.tipo,DF.est,DF.desde||DF.hasta].filter(Boolean).length}

  return info+`<table><thead><tr><th>Fecha</th><th>Archivo</th><th>Tipo</th><th>Confianza</th><th>Estado</th><th class="tr">Acciones</th></tr></thead><tbody>

  <td>${d[2]?conf(d[2]):'<span class="muted">—</span>'}</td>
  <td>${d[3]==='COMPLETADO'?'<span class="chip ok"><span class="dot"></span>Completado</span>':d[3]==='ERROR'?'<span class="chip err"><span class="dot"></span>Error</span>':'<span class="chip br"><span class="dot"></span>Procesando</span>'}</td>
  <td class="tr" style="white-space:nowrap" onclick="event.stopPropagation()"><button class="btn gh sm" title="Ver" onclick="location.hash='#/documentos/${d[5]}'">${ic('eye')}</button><button class="btn gh sm" title="Reprocesar" onclick="toast('Reprocesando…')">${ic('refresh')}</button><button class="btn gh sm" title="Descargar" onclick="toast('Descargando JSON')">${ic('download')}</button></td></tr>`).join('')}</tbody></table>
  <div class="pager"><span>Mostrando ${n?'1–'+L.length+' de '+L.length:'1–10 de 214'} documentos</span><div><button>${ic('left',14)}</button><button class="on">1</button>${n?'':'<button>2</button><button>3</button><button>…</button><button>22</button>'}<button>${ic('right',14)}</button></div></div>`;

function capIniciar(file){
  const f=capFlujo();
  CAP.file=file;CAP.estado='proc';CAP.paso=0;CAP.err='';const tok=++CAP.tok;render();
  const avanza=()=>{
    if(tok!==CAP.tok||!location.hash.startsWith('#/captura'))return;
    CAP.paso++;
    if(CAP.paso<4){render();setTimeout(avanza,750)}
    else{CAP.estado=CAP.escenario==='ok'?'ok':CAP.escenario==='nomatch'?'nomatch':'error';CAP.paso=0;render()}
  };
  setTimeout(avanza,750);
}
function capElegir(file){
  const f=capFlujo();
  const ok=['image/jpeg','image/png'].concat(f.pdf?['application/pdf']:[]);
  if(!ok.includes(file.type)){CAP.err=`Ese formato no es válido. Usa ${fmts(f)}.`;render();return}
  if(file.size>10*1048576){CAP.err='El archivo pesa más de 10 MB. Prueba con uno más liviano.';render();return}
  const kb=file.size/1024;
  capIniciar({name:file.name,size:kb>1024?(kb/1024).toFixed(1).replace('.',',')+' MB':Math.round(kb)+' KB',url:file.type.startsWith('image/')?URL.createObjectURL(file):null});
}

const NAV=[['procesar','#/','Procesar','upload',''],['documentos','#/documentos','Documentos','file',''],['plantillas','#/plantillas','Plantillas','layers',''],['flujos','#/flujos','Flujos de captura','link','Editor'],['usuarios','#/usuarios','Usuarios','users','Administrador']];
function route(){
  const h=(location.hash||'#/').slice(2).split('/');
  if(h[0]==='')return {v:'procesar',n:'procesar'};
  if(h[0]==='documentos')return h[1]?{v:'detalle',n:'documentos'}:{v:'documentos',n:'documentos'};
  if(h[0]==='plantillas')return h[1]==='nueva'?{v:'nueva',a:h[2]||1,n:'plantillas'}:h[1]?{v:'editar',n:'plantillas'}:{v:'plantillas',n:'plantillas'};
  if(h[0]==='flujos')return h[1]?{v:'flujo',a:h[1],n:'flujos'}:{v:'flujos',n:'flujos'};
  if(h[0]==='captura'||h[0]==='procesar')return {v:'captura',a:h[1],n:'',solo:true};
  if(h[0]==='usuarios')return {v:'usuarios',n:'usuarios'};
  if(h[0]==='acceso')return {v:'acceso',n:''};
  return {v:'procesar',n:'procesar'};
}

  return `<b>Maqueta navegable</b>`;
}
window.setP=k=>{estadoProc=k;render()};window.setL=k=>{estadoPlant=k;render()};
const _setCapE=window.setCapE;window.setCapE=k=>{_setCapE(k);render()};
function render(){
  const r=route(),sy=scrollY;
  document.body.classList.toggle('solo',!!r.solo);
  let sec=false;
  $('#nav').innerHTML=NAV.filter(n=>!n[4]||puede(n[4])).map(n=>{
    const h=n[4]&&!sec?(sec=true,'<div class="sec">Administración</div>'):'';
    return h+`<a href="${n[1]}" class="${n[0]===r.n?'on':''}">${ic(n[3])}${n[2]}${n[0]==='plantillas'?'<span class="cnt">3</span>':n[0]==='documentos'?'<span class="cnt">214</span>':n[0]==='flujos'?'<span class="cnt">'+FLUJOS.length+'</span>':n[0]==='usuarios'?'<span class="cnt">'+USR.length+'</span>':''}</a>`}).join('');
  const sel=$('#rol');if(sel&&sel.value!==ROL)sel.value=ROL;
  const view=$('#view');view.innerHTML=V[r.v](r.a);
  (V[r.v].after||(()=>{}))(view);
  $('#demo').innerHTML=demoBar(r);
  if(V._last===location.hash)scrollTo(0,sy);else scrollTo(0,0);V._last=location.hash;
}
$('#rol').onchange=e=>{ROL=e.target.value;render();toast('Ahora ves la maqueta como '+ROL)};
addEventListener('hashchange',()=>{V._tab='res';render()});
render();
</script>
</body>
